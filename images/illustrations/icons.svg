<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dinkli pipeline icons. Use with <svg><use href="icons.svg#i-detect"/></svg>; strokes follow currentColor. -->
  <defs>
    <symbol id="i-book" viewBox="0 0 64 64">
      <rect x="8" y="12" width="48" height="44" fill="#FFFFFF" stroke="currentColor" stroke-width="4"/>
      <rect x="8" y="12" width="48" height="12" fill="#00FF00" stroke="currentColor" stroke-width="4"/>
      <line x1="20" y1="6" x2="20" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="6" x2="44" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polyline points="22,40 29,47 43,33" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-rig" viewBox="0 0 64 64">
      <rect x="14" y="8" width="30" height="20" fill="#00FF00" stroke="currentColor" stroke-width="4"/>
      <polygon points="44,12 54,8 54,28 44,24" fill="#FFFFFF" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="29" cy="18" r="5" fill="#FFFFFF" stroke="currentColor" stroke-width="3"/>
      <line x1="29" y1="28" x2="29" y2="40" stroke="currentColor" stroke-width="4"/>
      <line x1="29" y1="40" x2="14" y2="58" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="29" y1="40" x2="29" y2="58" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="29" y1="40" x2="44" y2="58" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-detect" viewBox="0 0 64 64">
      <path d="M6 18 V6 H18 M46 6 H58 V18 M58 46 V58 H46 M18 58 H6 V46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
      <circle cx="28" cy="20" r="6" fill="#FFFFFF" stroke="currentColor" stroke-width="3"/>
      <rect x="20" y="28" width="16" height="20" rx="7" fill="#00FF00" stroke="currentColor" stroke-width="3"/>
      <circle cx="46" cy="24" r="4" fill="#FFFFFF" stroke="currentColor" stroke-width="3"/>
    </symbol>

    <symbol id="i-analyze" viewBox="0 0 64 64">
      <line x1="8" y1="56" x2="58" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="38" width="10" height="18" fill="#FFFFFF" stroke="currentColor" stroke-width="3"/>
      <rect x="27" y="28" width="10" height="28" fill="#FFFFFF" stroke="currentColor" stroke-width="3"/>
      <rect x="42" y="18" width="10" height="38" fill="#00FF00" stroke="currentColor" stroke-width="3"/>
      <polyline points="10,26 24,16 34,20 52,6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="44,6 52,6 52,14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-deliver" viewBox="0 0 64 64">
      <rect x="16" y="4" width="32" height="56" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="4"/>
      <rect x="21" y="12" width="22" height="22" fill="#00FF00" stroke="currentColor" stroke-width="3"/>
      <polygon points="28,17 28,29 38,23" fill="currentColor"/>
      <line x1="22" y1="42" x2="42" y2="42" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="49" x2="35" y2="49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
