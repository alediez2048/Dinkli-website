<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Dinkli game film screen</title>
  <desc id="desc">An example phone screen showing a recorded game with the player highlighted, a timeline with highlight markers, and a list of personal highlight clips.</desc>
  <style>
    text { font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .you-box { animation: you-pulse 2s ease-in-out infinite; }
    }
    @keyframes you-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <!-- Phone frame -->
  <rect x="20" y="20" width="362" height="816" rx="52" fill="#00FF00" stroke="#000000" stroke-width="4"/>
  <rect x="8" y="8" width="362" height="816" rx="52" fill="#000000"/>
  <rect x="22" y="22" width="334" height="788" rx="40" fill="#FFFFFF"/>
  <rect x="139" y="34" width="100" height="26" rx="13" fill="#000000"/>
  <text x="50" y="54" font-size="15" font-weight="700" fill="#000000">9:41</text>

  <!-- Header -->
  <text x="40" y="104" font-size="28" font-weight="700" fill="#000000">Game film</text>
  <text x="40" y="128" font-size="14" font-weight="500" fill="#333333">Saturday doubles · 4 players</text>

  <!-- Video pane -->
  <rect x="36" y="146" width="306" height="200" fill="#333333" stroke="#000000" stroke-width="4"/>
  <polygon points="130,176 248,176 312,330 66,330" fill="#00FF00"/>
  <polygon points="130,176 248,176 312,330 66,330" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="111" y1="222" x2="267" y2="222" stroke="#000000" stroke-width="2"/>
  <line x1="88" y1="276" x2="290" y2="276" stroke="#000000" stroke-width="2"/>
  <line x1="98" y1="245" x2="280" y2="245" stroke="#FFFFFF" stroke-width="4"/>
  <!-- tiny players -->
  <g stroke="#000000" stroke-width="2">
    <circle cx="152" cy="190" r="5" fill="#FFFFFF"/>
    <rect x="146" y="196" width="12" height="16" rx="5" fill="#FFFFFF"/>
    <circle cx="226" cy="196" r="5" fill="#FFFFFF"/>
    <rect x="220" y="202" width="12" height="16" rx="5" fill="#FFFFFF"/>
    <circle cx="140" cy="258" r="7" fill="#FFFFFF"/>
    <rect x="132" y="266" width="16" height="24" rx="7" fill="#333333"/>
    <circle cx="232" cy="276" r="8" fill="#FFFFFF"/>
    <rect x="223" y="285" width="18" height="27" rx="8" fill="#333333"/>
  </g>
  <rect x="215" y="266" width="34" height="52" fill="none" stroke="#000000" stroke-width="6"/>
  <rect class="you-box" x="215" y="266" width="34" height="52" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="212" y="249" width="40" height="17" fill="#000000"/>
  <text x="219" y="262" class="mono" font-size="11" font-weight="700" fill="#00FF00">YOU</text>
  <rect x="46" y="314" width="64" height="22" fill="#000000"/>
  <text x="55" y="330" class="mono" font-size="13" font-weight="700" fill="#00FF00">02:14</text>

  <!-- Timeline with highlight markers -->
  <rect x="36" y="362" width="306" height="12" fill="#F5F5F5" stroke="#000000" stroke-width="3"/>
  <rect x="36" y="362" width="96" height="12" fill="#000000"/>
  <g fill="#00FF00" stroke="#000000" stroke-width="2">
    <rect x="92" y="357" width="8" height="22"/>
    <rect x="168" y="357" width="8" height="22"/>
    <rect x="236" y="357" width="8" height="22"/>
    <rect x="300" y="357" width="8" height="22"/>
  </g>
  <circle cx="132" cy="368" r="9" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- Highlights -->
  <text x="40" y="420" font-size="20" font-weight="700" fill="#000000">Your highlights</text>

  <g>
    <rect x="42" y="444" width="300" height="78" fill="#000000"/>
    <rect x="36" y="438" width="300" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="46" y="448" width="86" height="58" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <line x1="46" y1="472" x2="132" y2="472" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="82,465 82,489 100,477" fill="#000000"/>
    <text x="146" y="472" font-size="16" font-weight="700" fill="#000000">Third-shot drop</text>
    <text x="146" y="496" class="mono" font-size="13" fill="#333333">02:14 · 0:08</text>
  </g>
  <g>
    <rect x="42" y="536" width="300" height="78" fill="#000000"/>
    <rect x="36" y="530" width="300" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="46" y="540" width="86" height="58" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <line x1="46" y1="564" x2="132" y2="564" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="82,557 82,581 100,569" fill="#000000"/>
    <text x="146" y="564" font-size="16" font-weight="700" fill="#000000">Kitchen battle</text>
    <text x="146" y="588" class="mono" font-size="13" fill="#333333">05:48 · 0:21</text>
  </g>
  <g>
    <rect x="42" y="628" width="300" height="78" fill="#000000"/>
    <rect x="36" y="622" width="300" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <rect x="46" y="632" width="86" height="58" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <line x1="46" y1="656" x2="132" y2="656" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="82,649 82,673 100,661" fill="#000000"/>
    <text x="146" y="656" font-size="16" font-weight="700" fill="#000000">Put-away winner</text>
    <text x="146" y="680" class="mono" font-size="13" fill="#333333">11:02 · 0:06</text>
  </g>

  <!-- Share button -->
  <rect x="42" y="736" width="300" height="52" fill="#000000"/>
  <rect x="36" y="730" width="300" height="52" fill="#00FF00" stroke="#000000" stroke-width="4"/>
  <text x="186" y="763" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">SHARE HIGHLIGHT</text>
</svg>
