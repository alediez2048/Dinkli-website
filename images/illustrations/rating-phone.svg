<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Dinkli Rating screen</title>
  <desc id="desc">An example phone screen showing a Dinkli Rating that went up after the latest game, a chart of the last six games moving up and down, and this game's stats compared with the previous game.</desc>
  <style>
    text { font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .spark { stroke-dasharray: 400; stroke-dashoffset: 400; animation: spark-draw 1.6s ease-out 0.3s forwards; }
    }
    @keyframes spark-draw { to { stroke-dashoffset: 0; } }
  </style>

  <!-- Phone frame -->
  <rect x="20" y="20" width="362" height="816" rx="52" fill="#00FF00" stroke="#000000" stroke-width="4"/>
  <rect x="8" y="8" width="362" height="816" rx="52" fill="#000000"/>
  <rect x="22" y="22" width="334" height="788" rx="40" fill="#FFFFFF"/>
  <rect x="139" y="34" width="100" height="26" rx="13" fill="#000000"/>
  <text x="50" y="54" font-size="15" font-weight="700" fill="#000000">9:41</text>

  <!-- Header -->
  <text x="40" y="104" font-size="28" font-weight="700" fill="#000000">Dinkli Rating</text>
  <text x="40" y="128" font-size="14" font-weight="500" fill="#333333">Updated after Saturday doubles</text>

  <!-- Rating -->
  <text x="36" y="226" font-size="88" font-weight="700" fill="#000000" letter-spacing="-2">4.12</text>
  <rect x="250" y="176" width="92" height="40" fill="#000000"/>
  <rect x="246" y="172" width="92" height="40" fill="#00FF00" stroke="#000000" stroke-width="3"/>
  <text x="292" y="199" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">▲ 0.06</text>

  <!-- Last six games -->
  <text x="40" y="270" class="mono" font-size="13" font-weight="700" fill="#000000" letter-spacing="1">LAST 6 GAMES</text>
  <rect x="36" y="282" width="306" height="130" fill="#F5F5F5" stroke="#000000" stroke-width="3"/>
  <line x1="48" y1="347" x2="330" y2="347" stroke="#333333" stroke-width="1" stroke-dasharray="4 6"/>
  <polyline class="spark" points="60,369 112,351 164,388 216,357 268,345 320,308" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#000000" stroke-width="3">
    <circle cx="60" cy="369" r="6"/>
    <circle cx="112" cy="351" r="6"/>
    <circle cx="164" cy="388" r="6"/>
    <circle cx="216" cy="357" r="6"/>
    <circle cx="268" cy="345" r="6"/>
    <circle cx="320" cy="308" r="9" fill="#00FF00"/>
  </g>

  <!-- This game's stats -->
  <text x="40" y="452" font-size="18" font-weight="700" fill="#000000">This game vs. last game</text>

  <g>
    <text x="40" y="500" font-size="16" font-weight="500" fill="#000000">Kitchen arrivals</text>
    <text x="262" y="501" font-size="20" font-weight="700" fill="#000000" text-anchor="end">18</text>
    <rect x="274" y="479" width="62" height="30" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <text x="305" y="500" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">▲ 3</text>
    <line x1="40" y1="524" x2="336" y2="524" stroke="#333333" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <g>
    <text x="40" y="562" font-size="16" font-weight="500" fill="#000000">Unforced errors</text>
    <text x="262" y="563" font-size="20" font-weight="700" fill="#000000" text-anchor="end">7</text>
    <rect x="274" y="541" width="62" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="305" y="562" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">▼ 2</text>
    <line x1="40" y1="586" x2="336" y2="586" stroke="#333333" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <g>
    <text x="40" y="624" font-size="16" font-weight="500" fill="#000000">Third-shot drops</text>
    <text x="262" y="625" font-size="20" font-weight="700" fill="#000000" text-anchor="end">11</text>
    <rect x="274" y="603" width="62" height="30" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <text x="305" y="624" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">▲ 4</text>
    <line x1="40" y1="648" x2="336" y2="648" stroke="#333333" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <g>
    <text x="40" y="686" font-size="16" font-weight="500" fill="#000000">Rallies won</text>
    <text x="262" y="687" font-size="20" font-weight="700" fill="#000000" text-anchor="end">24</text>
    <rect x="274" y="665" width="62" height="30" fill="#00FF00" stroke="#000000" stroke-width="2"/>
    <text x="305" y="686" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">▲ 5</text>
  </g>

  <!-- Footer -->
  <rect x="36" y="730" width="306" height="52" fill="#000000"/>
  <text x="189" y="761" font-size="15" font-weight="700" fill="#00FF00" text-anchor="middle">Moves up or down every game</text>
</svg>
