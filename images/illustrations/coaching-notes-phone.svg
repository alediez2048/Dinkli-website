<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Dinkli coaching notes screen</title>
  <desc id="desc">An example phone screen listing four timestamped coaching notes from a recorded game, covering positioning, dinking, footwork and teamwork.</desc>
  <style>
    text { font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- Phone frame -->
  <rect x="20" y="20" width="362" height="816" rx="52" fill="#00FF00" stroke="#000000" stroke-width="4"/>
  <rect x="8" y="8" width="362" height="816" rx="52" fill="#000000"/>
  <rect x="22" y="22" width="334" height="788" rx="40" fill="#FFFFFF"/>
  <rect x="139" y="34" width="100" height="26" rx="13" fill="#000000"/>
  <text x="50" y="54" font-size="15" font-weight="700" fill="#000000">9:41</text>

  <!-- Header -->
  <text x="40" y="104" font-size="28" font-weight="700" fill="#000000">Coaching notes</text>
  <text x="40" y="128" font-size="14" font-weight="500" fill="#333333">Saturday doubles · 4 things to work on</text>

  <!-- Note 1 (highlighted) -->
  <rect x="42" y="156" width="300" height="132" fill="#000000"/>
  <rect x="36" y="150" width="300" height="132" fill="#00FF00" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="166" width="62" height="24" fill="#000000"/>
  <text x="58" y="183" class="mono" font-size="14" font-weight="700" fill="#00FF00">02:14</text>
  <text x="322" y="183" font-size="12" font-weight="700" fill="#000000" text-anchor="end" letter-spacing="1">POSITIONING</text>
  <text x="50" y="218" font-size="17" font-weight="700" fill="#000000">Hold the kitchen line</text>
  <text x="50" y="242" font-size="17" font-weight="700" fill="#000000">after your third shot.</text>
  <text x="50" y="268" class="mono" font-size="13" font-weight="700" fill="#000000">▶ WATCH CLIP</text>

  <!-- Note 2 -->
  <rect x="42" y="306" width="300" height="132" fill="#000000"/>
  <rect x="36" y="300" width="300" height="132" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="316" width="62" height="24" fill="#000000"/>
  <text x="58" y="333" class="mono" font-size="14" font-weight="700" fill="#00FF00">05:48</text>
  <text x="322" y="333" font-size="12" font-weight="700" fill="#333333" text-anchor="end" letter-spacing="1">DINKING</text>
  <text x="50" y="368" font-size="17" font-weight="700" fill="#000000">Keep resets low. Aim at</text>
  <text x="50" y="392" font-size="17" font-weight="700" fill="#000000">your opponent's feet.</text>
  <text x="50" y="418" class="mono" font-size="13" font-weight="700" fill="#333333">▶ WATCH CLIP</text>

  <!-- Note 3 -->
  <rect x="42" y="456" width="300" height="132" fill="#000000"/>
  <rect x="36" y="450" width="300" height="132" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="466" width="62" height="24" fill="#000000"/>
  <text x="58" y="483" class="mono" font-size="14" font-weight="700" fill="#00FF00">08:31</text>
  <text x="322" y="483" font-size="12" font-weight="700" fill="#333333" text-anchor="end" letter-spacing="1">FOOTWORK</text>
  <text x="50" y="518" font-size="17" font-weight="700" fill="#000000">Split-step before your</text>
  <text x="50" y="542" font-size="17" font-weight="700" fill="#000000">opponent makes contact.</text>
  <text x="50" y="568" class="mono" font-size="13" font-weight="700" fill="#333333">▶ WATCH CLIP</text>

  <!-- Note 4 -->
  <rect x="42" y="606" width="300" height="132" fill="#000000"/>
  <rect x="36" y="600" width="300" height="132" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="50" y="616" width="62" height="24" fill="#000000"/>
  <text x="58" y="633" class="mono" font-size="14" font-weight="700" fill="#00FF00">11:02</text>
  <text x="322" y="633" font-size="12" font-weight="700" fill="#333333" text-anchor="end" letter-spacing="1">TEAMWORK</text>
  <text x="50" y="668" font-size="17" font-weight="700" fill="#000000">Shift with your partner</text>
  <text x="50" y="692" font-size="17" font-weight="700" fill="#000000">to close the middle.</text>
  <text x="50" y="718" class="mono" font-size="13" font-weight="700" fill="#333333">▶ WATCH CLIP</text>

  <!-- Footer hint -->
  <text x="186" y="776" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Tips update after every recorded game</text>
</svg>
